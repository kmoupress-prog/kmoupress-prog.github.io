# Home: public chat room in MomoTalk style — read by _layouts/home.html, run by assets/js/kei-chat.js.
# Messages are stored in Firebase Realtime Database (chat/messages); visitors sign in anonymously.
# Leave `firebase` empty and the room shows as "준비 중".

room: KEI-LAB 라운지
history: 100          # how many recent messages to load

firebase:             # public web config (safe to publish; access is limited by the database rules)
  apiKey: AIzaSyAKTYFC9CD2uak1TjeXjlHJYF17zlBHs84
  authDomain: kei-lab.firebaseapp.com
  databaseURL: https://kei-lab-default-rtdb.asia-southeast1.firebasedatabase.app
  projectId: kei-lab
  appId: '1:938151081968:web:3cc562bd7af14705808f35'

# pinned at the top of the room, from Kei (text or { sticker: <id> })
kei_name: 케이
kei_avatar: /assets/img/chat/kei-avatar.jpg
stickers: /assets/img/chat/
welcome:
  - { sticker: hello }
  - 여기는 KEI-LAB 공개 채팅방입니다.
  - 닉네임만 정하면 누구나 말을 남길 수 있습니다.
  - 단, 이상한 말을 남기면 제가 지울 겁니다.
