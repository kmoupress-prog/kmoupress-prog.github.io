name: "Preview build (no deploy)"
on:
  push:
    branches: [preview-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: "production"
      - name: Push built site to preview-site branch
        run: |
          cd _site
          git init -q -b preview-site
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add -A
          git commit -qm "preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-site
