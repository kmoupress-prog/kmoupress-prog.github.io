<!-- Site look (ICD-LAB style) and reading font; see assets/css/site.css -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">

<!-- Sidebar: expandable category list (see _includes/sidebar.html) -->
<style>
  #sidebar details.nav-categories > summary.nav-link {
    padding-top: 0.6rem;
    padding-bottom: 0.6rem;
    display: flex;
    align-items: center;
    border-radius: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }

  #sidebar details.nav-categories > summary::-webkit-details-marker {
    display: none;
  }

  #sidebar details.nav-categories > summary.nav-link:hover {
    background-color: var(--sidebar-hover-bg);
  }

  #sidebar details.nav-categories > summary.nav-link i {
    font-size: 95%;
    opacity: 0.8;
    margin-right: 1.5rem;
  }

  #sidebar details.nav-categories > summary.nav-link span {
    font-size: 90%;
    letter-spacing: 0.2px;
  }

  #sidebar details.nav-categories > summary .nav-categories-caret {
    margin: 0 0 0 auto;
    transition: transform 0.2s ease;
  }

  #sidebar details.nav-categories[open] > summary .nav-categories-caret {
    transform: rotate(180deg);
  }

  #sidebar li.nav-item.active details.nav-categories > summary.nav-link {
    color: var(--sidebar-active-color);
    background-color: var(--sidebar-hover-bg);
  }

  #sidebar ul.nav-categories-list {
    list-style: none;
    margin: 0.25rem 0 0;
    padding: 0 0 0 2.5rem;
  }

  #sidebar .nav-categories-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.45rem 1rem;
    border-radius: 0.6rem;
    font-size: 85%;
    font-weight: 500;
    color: var(--sidebar-muted-color);
    text-decoration: none;
  }

  #sidebar .nav-categories-link:hover,
  #sidebar .nav-categories-link.active {
    color: var(--sidebar-active-color);
    background-color: var(--sidebar-hover-bg);
  }

  #sidebar .nav-categories-count {
    font-size: 85%;
    opacity: 0.6;
  }

  /* a category with sub-categories (e.g. Projects) */
  #sidebar details.nav-categories-group > summary.nav-categories-link {
    cursor: pointer;
    list-style: none;
    user-select: none;
  }

  #sidebar details.nav-categories-group > summary::-webkit-details-marker {
    display: none;
  }

  #sidebar details.nav-categories-group > summary .nav-categories-count {
    margin-left: auto;
  }

  #sidebar details.nav-categories-group > summary .nav-categories-caret {
    margin-left: 0.6rem;
    font-size: 80%;
    opacity: 0.7;
    transition: transform 0.2s ease;
  }

  #sidebar details.nav-categories-group[open] > summary .nav-categories-caret {
    transform: rotate(180deg);
  }

  /* interactive demos in posts (scripts live in assets/js/demos/) */
  .mv-demo {
    border: 1px solid var(--main-border-color, #e5e5e5);
    border-radius: 0.75rem;
    padding: 1rem;
    margin: 1.25rem 0;
    background: var(--card-bg, transparent);
  }

  .mv-demo canvas {
    display: block;
    width: 100%;
    max-width: 640px;
    height: auto;
    margin: 0 auto;
    border-radius: 0.5rem;
    touch-action: none;
  }

  .mv-demo .mv-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    align-items: center;
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: var(--text-muted-color, #757575);
  }

  .mv-demo .mv-controls label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .mv-demo .mv-readout {
    margin-top: 0.5rem;
    font-size: 0.9rem;
    color: var(--text-color, inherit);
    font-variant-numeric: tabular-nums;
  }

  #sidebar ul.nav-categories-sublist {
    list-style: none;
    margin: 0.15rem 0 0.25rem;
    padding: 0 0 0 1rem;
  }
</style>
