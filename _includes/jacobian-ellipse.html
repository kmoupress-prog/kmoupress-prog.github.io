<div class="je-widget" style="max-width:760px;margin:1.5rem auto 2rem;padding:1rem 1rem 1.25rem;background:var(--c-panel);border:1px solid var(--c-line);border-radius:12px">
<svg id="je-sv" width="100%" viewBox="0 0 680 330" role="img" aria-label="2관절 팔에서 관절 변화의 원이 손끝에서 타원으로 바뀌는 모습" style="display:block">
<defs><marker id="je-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="110" cy="160" r="55" fill="#f59ac8" fill-opacity="0.12" stroke="#f59ac8" stroke-width="2"/>
<line x1="45" y1="160" x2="175" y2="160" stroke="#4a5070" stroke-width="1"/>
<line x1="110" y1="95" x2="110" y2="225" stroke="#4a5070" stroke-width="1"/>
<text x="180" y="164" fill="#a9acc4" font-size="13">Δq₁</text>
<text x="102" y="86" fill="#a9acc4" font-size="13">Δq₂</text>
<text x="110" y="252" text-anchor="middle" fill="#a9acc4" font-size="13">관절 변화</text>
<text x="110" y="270" text-anchor="middle" fill="#a9acc4" font-size="13">(모든 방향 같은 양)</text>
<line x1="200" y1="160" x2="262" y2="160" stroke="#a9acc4" stroke-width="1.5" marker-end="url(#je-arrow)"/>
<text x="231" y="148" text-anchor="middle" fill="#eceaf4" font-size="16" font-weight="700">J</text>
<rect x="290" y="300" width="56" height="12" rx="2" fill="#4a5070"/>
<line id="je-l1" stroke="#5db4f2" stroke-width="9" stroke-linecap="round"/>
<line id="je-l2" stroke="#5db4f2" stroke-width="9" stroke-linecap="round"/>
<circle id="je-j1" r="6" fill="#1c1d2b" stroke="#5db4f2" stroke-width="2.5"/>
<circle id="je-j2" r="6" fill="#1c1d2b" stroke="#5db4f2" stroke-width="2.5"/>
<ellipse id="je-el" fill="#f59ac8" fill-opacity="0.15" stroke="#f59ac8" stroke-width="2"/>
<line id="je-ax" stroke="#f3c94f" stroke-width="3" stroke-linecap="round"/>
<circle id="je-tip" r="4" fill="#eceaf4"/>
<text x="500" y="324" text-anchor="middle" fill="#a9acc4" font-size="13">손끝 변화(타원) · 노란 선 = 가장 안 움직이는 방향</text>
</svg>
<div style="display:flex;align-items:center;gap:12px;margin:10px 0 6px;flex-wrap:wrap">
<label for="je-q2" style="font-size:0.95rem;color:var(--c-dim);margin:0">팔꿈치 q₂</label>
<input type="range" id="je-q2" min="0" max="150" step="1" value="30" style="flex:1;min-width:160px;accent-color:#f59ac8">
<span id="je-q2o" style="font-weight:700;min-width:44px;text-align:right;color:var(--c-text)">30°</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px">
<button type="button" class="je-pre" data-v="90" style="background:transparent;color:var(--c-text);border:1px solid var(--c-line);border-radius:8px;padding:2px 12px;font-size:0.9rem">90°</button>
<button type="button" class="je-pre" data-v="30" style="background:transparent;color:var(--c-text);border:1px solid var(--c-line);border-radius:8px;padding:2px 12px;font-size:0.9rem">30°</button>
<button type="button" class="je-pre" data-v="10" style="background:transparent;color:var(--c-text);border:1px solid var(--c-line);border-radius:8px;padding:2px 12px;font-size:0.9rem">10°</button>
<button type="button" class="je-pre" data-v="1" style="background:transparent;color:var(--c-text);border:1px solid var(--c-line);border-radius:8px;padding:2px 12px;font-size:0.9rem">1°</button>
<button type="button" class="je-pre" data-v="0" style="background:transparent;color:var(--c-text);border:1px solid var(--c-line);border-radius:8px;padding:2px 12px;font-size:0.9rem">0° (일직선)</button>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
<div style="background:var(--c-ground);border-radius:8px;padding:0.75rem 1rem"><div style="font-size:0.85rem;color:var(--c-dim)">σ<sub>max</sub> 긴 반지름</div><div id="je-smx" style="font-size:1.4rem;font-weight:700;color:var(--c-text)">-</div></div>
<div style="background:var(--c-ground);border-radius:8px;padding:0.75rem 1rem"><div style="font-size:0.85rem;color:var(--c-dim)">σ<sub>min</sub> 짧은 반지름</div><div id="je-smn" style="font-size:1.4rem;font-weight:700;color:#f3c94f">-</div></div>
<div style="background:var(--c-ground);border-radius:8px;padding:0.75rem 1rem"><div style="font-size:0.85rem;color:var(--c-dim)">det J 넓이 배율</div><div id="je-det" style="font-size:1.4rem;font-weight:700;color:var(--c-text)">-</div></div>
<div style="background:var(--c-ground);border-radius:8px;padding:0.75rem 1rem"><div style="font-size:0.85rem;color:var(--c-dim)">1/σ<sub>min</sub> 폭주 배율</div><div id="je-inv" style="font-size:1.4rem;font-weight:700;color:#f59ac8">-</div></div>
</div>
<p id="je-msg" style="font-size:0.95rem;color:var(--c-dim);margin:12px 0 0"></p>
</div>
<script>
(function(){
var L1=0.5,L2=0.5,Q1=30*Math.PI/180,S=220,BX=318,BY=300,R=0.35;
function g(id){return document.getElementById(id);}
function P(x,y){return [BX+x*S,BY-y*S];}
function set(el,a){for(var k in a){el.setAttribute(k,a[k]);}}
function upd(){
var d=+g('je-q2').value,q2=d*Math.PI/180,q12=Q1+q2;
var ex=L1*Math.cos(Q1),ey=L1*Math.sin(Q1),tx=ex+L2*Math.cos(q12),ty=ey+L2*Math.sin(q12);
var b=P(0,0),p=P(ex,ey),u=P(tx,ty);
set(g('je-l1'),{x1:b[0],y1:b[1],x2:p[0],y2:p[1]});set(g('je-l2'),{x1:p[0],y1:p[1],x2:u[0],y2:u[1]});
set(g('je-j1'),{cx:b[0],cy:b[1]});set(g('je-j2'),{cx:p[0],cy:p[1]});set(g('je-tip'),{cx:u[0],cy:u[1]});
var a11=-L1*Math.sin(Q1)-L2*Math.sin(q12),a12=-L2*Math.sin(q12),a21=L1*Math.cos(Q1)+L2*Math.cos(q12),a22=L2*Math.cos(q12);
var A=a11*a11+a12*a12,B=a11*a21+a12*a22,C=a21*a21+a22*a22,tr=(A+C)/2,df=Math.sqrt(Math.pow((A-C)/2,2)+B*B);
var smax=Math.sqrt(tr+df),smin=Math.sqrt(Math.max(tr-df,0)),th=0.5*Math.atan2(2*B,A-C),det=Math.abs(a11*a22-a12*a21);
var rx=Math.max(smax*R*S,1),ry=Math.max(smin*R*S,0.8);
set(g('je-el'),{cx:u[0],cy:u[1],rx:rx,ry:ry,transform:'rotate('+(-th*180/Math.PI)+' '+u[0]+' '+u[1]+')'});
var mn=th+Math.PI/2,len=Math.max(ry,12);
set(g('je-ax'),{x1:u[0]-Math.cos(mn)*len,y1:u[1]+Math.sin(mn)*len,x2:u[0]+Math.cos(mn)*len,y2:u[1]-Math.sin(mn)*len});
g('je-q2o').textContent=d+'°';g('je-smx').textContent=smax.toFixed(3);g('je-smn').textContent=smin.toFixed(3);
g('je-det').textContent=det.toFixed(3);g('je-inv').textContent=smin<1e-3?'∞':(1/smin).toFixed(1)+'배';
g('je-msg').textContent=d===0?'팔이 일직선입니다. 타원이 선으로 눌려서 노란 방향(팔 방향)으로는 손끝이 못 움직입니다. 특이점입니다.':
(smin<0.08?'타원이 납작해지는 중입니다. 노란 방향으로 조금 가려면 관절이 '+(1/smin).toFixed(0)+'배 빨리 돌아야 합니다.':'타원이 둥글수록 어느 방향이든 고르게 움직입니다.');
}
g('je-q2').addEventListener('input',upd);
var bs=document.querySelectorAll('.je-pre');
for(var i=0;i<bs.length;i++){bs[i].addEventListener('click',function(){g('je-q2').value=this.getAttribute('data-v');upd();});}
upd();
})();
</script>
