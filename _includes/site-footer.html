<!-- Site footer: a dark bottom bar with what the site name means and the visitor counter (assets/js/visit-count.js). -->

<footer class="site-footer" aria-label="Site Info">
  <div class="site-footer-bar">
    <p class="site-footer-motto">
      수상한<i>(Special)</i> 게임<i>(Geometry And Motion Estimation)</i> 동아리<i>(Group)</i>
      <span>— SE(3) 위에서 기하와 움직임을 추정하는 무리</span>
    </p>
    <span>
      © {{ 'now' | date: '%Y' }} {{ site.social.name }}. Powered by
      <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a> &amp;
      <a href="https://github.com/cotes2020/jekyll-theme-chirpy" target="_blank" rel="noopener">Chirpy</a>.
    </span>
    {% assign _db = site.data.kei_chat.firebase.databaseURL %}
    {% if _db %}
      <span class="site-visits" data-visits data-db="{{ _db }}" hidden>
        <span class="site-visits-item">TODAY <b data-today>-</b></span>
        <span class="site-visits-item">TOTAL <b data-total>-</b></span>
      </span>
      <script src="{{ '/assets/js/visit-count.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
    {% endif %}
  </div>
</footer>
